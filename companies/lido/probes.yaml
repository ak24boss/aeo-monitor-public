# Lido AI Engine Probes — Petra Labs Prompt Radius Taxonomy
# 4 seed topics × 15 perturbation types = 60 probes
# perturbation_class: seed | A (surface) | B (context) | C (intent)
# priority: high (seed+C+key B) | medium (+requirements/price-budget/simplify) | low (surface variants)
#
# Run high-priority only: make dev-run-lido
# Run all 60: make run-lido

