# priority: high (seed+C+key B) | medium (simplify+requirements+price-budget) | low (rest)
#
# Seed topics:
#   1. farm-accounting        — "What farm accounting software should I use?"
#   2. ranch-bookkeeping      — "What ranch bookkeeping software should I use?"
#   3. trucking-accounting    — "What accounting software for owner-operator trucking should I use?"
#   4. contractor-accounting  — "What job costing and accounting software should I use for my contracting business?"
#   5. ag-financial-mgmt      — "What all-in-one financial management software should I use for my agriculture business?"
#   6. quickbooks-alt-ag      — "What QuickBooks alternative should I use for my farm or ranch?"

